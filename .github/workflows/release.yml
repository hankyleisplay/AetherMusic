name: AetherMusic Cross-Platform Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run offline Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --skip test_live_backend_pipeline

      - name: Build Tauri Windows bundle
        run: npx tauri build --ci

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: aethermusic-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain (Universal macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri macOS Universal bundle (.dmg)
        run: npx tauri build --target universal-apple-darwin --ci

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: aethermusic-macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
          if-no-files-found: warn

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libdbus-1-dev \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Linux packages (.deb & .AppImage)
        run: npx tauri build --bundles deb,appimage --ci

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: aethermusic-linux-x86_64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-android:
    name: Build Android (arm64 APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and SDK build tools
        shell: bash
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_SDK"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android project if missing
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          if [ -f "src-tauri/gen/android/app/build.gradle.kts" ]; then
            sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/g' src-tauri/gen/android/app/build.gradle.kts
          fi

      - name: Build Android APK (aarch64)
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' -type f | head -n 1)"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No unsigned APK found"
            exit 1
          fi
          OUT_DIR="$(dirname "$UNSIGNED_APK")"
          KEYSTORE="$RUNNER_TEMP/aethermusic-release.keystore"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using ANDROID_KEYSTORE_BASE64 from GitHub Actions Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE"
            KS_PASS="${ANDROID_KEYSTORE_PASSWORD:-aethermusic2026}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS:-aethermusic}"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$KS_PASS}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret found; generating fallback keystore..."
            KS_PASS="aethermusic"
            KEY_ALIAS="aethermusic"
            KEY_PASS="aethermusic"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=AetherMusic,O=hankyleisplay,C=TW"
          fi
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -v -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT_DIR/AetherMusic-arm64-signed.apk" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$UNSIGNED_APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: aethermusic-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*-signed.apk
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets and SHA-256 checksums
        shell: bash
        run: |
          mkdir -p release-upload
          find release-artifacts -type f \( \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.dmg' -o \
            -name '*.tar.gz' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.apk' \
          \) -exec cp -v {} release-upload/ \;
          ls -lh release-upload/
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-upload/* --repo "$GH_REPO" --clobber
          else
            gh release create "$TAG" release-upload/* \
              --repo "$GH_REPO" \
              --target "${{ github.sha }}" \
              --title "AetherMusic $TAG" \
              --generate-notes
          fi
