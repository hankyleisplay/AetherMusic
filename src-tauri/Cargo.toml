[package]
name = "aether-music"
version = "0.2.0"
description = "AetherMusic - Cloud streaming music player powered by Tauri, Rust, yt-dlp, and YTMAPI"
authors = ["HANSON <hankyleisplay@gmail.com>"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "aether_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
urlencoding = "2"
futures-util = "0.3"
